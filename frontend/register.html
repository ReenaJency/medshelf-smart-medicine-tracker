<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register an account on MedShelf - Smart Medicine Expiry Tracker for Home Use.">
  <title>Register | MedShelf Smart Medicine Tracker</title>
  
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <main class="auth-container">
    <div class="auth-card">
      
      <!-- Brand Identity -->
      <div class="auth-brand">
        <img src="assets/favicon.svg" alt="MedShelf Logo" class="brand-logo-img" width="52" height="52">
        <h1 class="brand-title">Med<span class="accent">Shelf</span></h1>
        <p class="brand-tagline">Smart Medicine Expiry Tracker</p>
      </div>

      <!-- Auth Header -->
      <div class="auth-header">
        <h2 class="auth-heading">Create Your Account</h2>
        <p class="auth-subheading">Start fresh with your private household medicine shelf (starts at 0 items)</p>
      </div>

      <!-- Alert Message Box -->
      <div id="auth-alert" class="alert-box" role="alert"></div>

      <!-- Registration Form -->
      <form id="register-form" novalidate>
        
        <!-- Full Name -->
        <div class="form-group">
          <label for="fullName" class="form-label">Full Name</label>
          <div class="form-control-wrap">
            <input 
              type="text" 
              id="fullName" 
              class="form-input" 
              placeholder="e.g. Reena, Priya, Sarah" 
              required 
              autocomplete="name">
          </div>
          <span class="field-error" id="fullName-error"></span>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="form-control-wrap">
            <input 
              type="email" 
              id="email" 
              class="form-input" 
              placeholder="name@example.com" 
              required 
              autocomplete="email">
          </div>
          <span class="field-error" id="email-error"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="form-control-wrap">
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              placeholder="Minimum 6 characters" 
              required 
              autocomplete="new-password">
            <button type="button" class="btn-toggle-pwd" data-target="password" aria-label="Toggle password visibility">👁️</button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <div class="form-control-wrap">
            <input 
              type="password" 
              id="confirmPassword" 
              class="form-input" 
              placeholder="Re-enter your password" 
              required 
              autocomplete="new-password">
            <button type="button" class="btn-toggle-pwd" data-target="confirmPassword" aria-label="Toggle password visibility">👁️</button>
          </div>
          <span class="field-error" id="confirmPassword-error"></span>
        </div>

        <!-- Register Submit Button -->
        <button type="submit" id="btn-submit-register" class="btn-submit">
          <span>Create Account</span>
        </button>

      </form>

      <!-- Footer Link to Login -->
      <div class="auth-footer">
        <p>Already have an account? <a href="login.html" class="auth-link">Sign In</a></p>
      </div>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
