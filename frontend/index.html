<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedShelf | Smart Medicine Expiry Tracker</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <script>
    // Immediate auth routing:
    // If user has a stored session token, proceed to Dashboard.
    // Otherwise, always direct the user to the Login page.
    const token = localStorage.getItem('medshelf_jwt_token');
    if (token) {
      window.location.replace('dashboard.html');
    } else {
      window.location.replace('login.html');
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loading-box {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #059669;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-box">
    <div class="spinner"></div>
    <p>Loading MedShelf...</p>
    <p style="font-size: 0.85rem; color: #64748b;">Redirecting to login...</p>
  </div>
</body>
</html>
